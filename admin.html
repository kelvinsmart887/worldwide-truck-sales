<!doctype html><html><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin</title><link rel="stylesheet" href="/style.css"><body><main><h2>Worldwide Truck Sales — Add Truck</h2><input id="key" type="password" placeholder="Admin key"><button onclick="localStorage.key=key.value">Save Key</button><form id="f"><input name="brand" placeholder="Brand" required><input name="model" placeholder="Model" required><input name="year" placeholder="Year" type="number"><input name="mileage" placeholder="Mileage km" type="number"><input name="price" placeholder="Price"><select name="currency"><option>USD</option><option>EUR</option><option>ZAR</option><option>TRY</option></select><select name="country" required><option value="">Country</option><option>USA</option><option>Germany</option><option>Romania</option><option>Italy</option><option>France</option><option>South Africa</option><option>Turkey</option></select><input name="city" placeholder="City"><input name="transmission" placeholder="Transmission"><input name="fuel" placeholder="Fuel"><input name="engine" placeholder="Engine"><input name="condition" placeholder="Condition"><input name="image" placeholder="Image URL (optional)"><input name="photo" type="file" accept="image/*"><textarea name="description" placeholder="Description"></textarea><button class="wa">Add Truck</button></form><p id="msg"></p></main><script>key.value=localStorage.key||'';f.onsubmit=async e=>{e.preventDefault();let r=await fetch('/api/trucks',{method:'POST',headers:{'x-admin-key':localStorage.key||''},body:new FormData(f)}),j=await r.json();msg.textContent=r.ok?'Truck added!':j.error}</script></body></html>
